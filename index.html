<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ISISNET | ULTRA FIBRA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@500;700&display=swap');
        
        body { 
            background: #000; 
            color: #fff; 
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .bg-glow {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% -10%, #1e40af 0%, #000 70%);
            z-index: -1;
        }

        .premium-card {
            background: linear-gradient(145deg, #111, #050505);
            border: 1px solid rgba(59, 130, 246, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 1);
            transition: all 0.3s ease;
        }

        .premium-card:active {
            transform: scale(0.96);
            border-color: #3b82f6;
        }

        .neon-text {
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
        }

        .fiber-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #3b82f6, transparent);
            width: 100%;
            margin: 15px 0;
        }

        footer a {
            transition: 0.3s;
            letter-spacing: 2px;
        }

        footer a:hover {
            color: #3b82f6;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        @media (max-width: 380px) {
            .text-custom-title { font-size: 2.5rem !important; }
            .card-padding { padding: 1.25rem !important; }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-start min-h-screen py-8 px-4">
    <div class="bg-glow"></div>

    <div class="w-full max-w-xl flex flex-col min-h-[90vh]">
        <header class="text-center mb-8">
            <div class="inline-block p-3 mb-4 bg-blue-600 rounded-2xl shadow-[0_0_30px_rgba(59,130,246,0.4)]">
                <i class="fas fa-bolt text-3xl md:text-5xl text-white"></i>
            </div>
            <h1 class="text-5xl md:text-8xl font-black neon-text italic uppercase tracking-tighter text-custom-title">ISIS<span class="text-blue-500">NET</span></h1>
            <div class="fiber-line"></div>
            <p class="text-lg md:text-2xl font-bold tracking-[0.2em] text-blue-400 uppercase">Ultra Velocidade</p>
        </header>

        <div class="flex flex-col gap-4 flex-grow">

            <a href="/sobrenos/" class="premium-card card-padding p-5 md:p-8 rounded-[1.5rem] md:rounded-[2rem] flex justify-between items-center group">
                <div class="flex items-center gap-4 md:gap-6">
                    <div class="w-12 h-12 md:w-16 md:h-16 bg-blue-500/10 rounded-xl flex items-center justify-center border border-blue-500/20 group-active:bg-blue-600 transition">
                        <i class="fas fa-info-circle text-2xl md:text-3xl text-blue-400 group-active:text-white"></i>
                    </div>
                    <div>
                        <h2 class="text-xl md:text-3xl font-black uppercase tracking-tighter leading-tight">Sobre Nós</h2>
                        <p class="text-xs md:text-base text-zinc-500 font-bold group-active:text-zinc-300">Conheça nossa história</p>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-zinc-700 group-active:text-blue-500 text-sm"></i>
            </a>

            <a href="/vendas/" class="premium-card card-padding p-5 md:p-8 rounded-[1.5rem] md:rounded-[2rem] flex justify-between items-center group">
                <div class="flex items-center gap-4 md:gap-6">
                    <div class="w-12 h-12 md:w-16 md:h-16 bg-blue-500/10 rounded-xl flex items-center justify-center border border-blue-500/20 group-active:bg-blue-600 transition">
                        <i class="fas fa-rocket text-2xl md:text-3xl text-blue-400 group-active:text-white"></i>
                    </div>
                    <div>
                        <h2 class="text-xl md:text-3xl font-black uppercase tracking-tighter leading-tight">Nossos Planos</h2>
                        <p class="text-xs md:text-base text-zinc-500 font-bold group-active:text-zinc-300">A internet mais rápida</p>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-zinc-700 group-active:text-blue-500 text-sm"></i>
            </a>

            <a href="/disponibilidade/" class="premium-card card-padding p-5 md:p-8 rounded-[1.5rem] md:rounded-[2rem] flex justify-between items-center group">
                <div class="flex items-center gap-4 md:gap-6">
                    <div class="w-12 h-12 md:w-16 md:h-16 bg-blue-500/10 rounded-xl flex items-center justify-center border border-blue-500/20 group-active:bg-blue-600 transition">
                        <i class="fas fa-map-marked-alt text-2xl md:text-3xl text-blue-400 group-active:text-white"></i>
                    </div>
                    <div>
                        <h2 class="text-xl md:text-3xl font-black uppercase tracking-tighter leading-tight">Ver Disponibilidade</h2>
                        <p class="text-xs md:text-base text-zinc-500 font-bold group-active:text-zinc-300">Consulte sua cobertura</p>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-zinc-700 group-active:text-blue-500 text-sm"></i>
            </a>

            <a href="/areadocliente/" class="premium-card card-padding p-5 md:p-8 rounded-[1.5rem] md:rounded-[2rem] flex justify-between items-center group">
                <div class="flex items-center gap-4 md:gap-6">
                    <div class="w-12 h-12 md:w-16 md:h-16 bg-blue-500/10 rounded-xl flex items-center justify-center border border-blue-500/20 group-active:bg-blue-600 transition">
                        <i class="fas fa-user-shield text-2xl md:text-3xl text-blue-400 group-active:text-white"></i>
                    </div>
                    <div>
                        <h2 class="text-xl md:text-3xl font-black uppercase tracking-tighter leading-tight">Área do Cliente</h2>
                        <p class="text-xs md:text-base text-zinc-500 font-bold group-active:text-zinc-300">2ª via e suporte</p>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-zinc-700 group-active:text-blue-500 text-sm"></i>
            </a>

        </div>

        <footer class="mt-12 text-center pb-8">
            <a href="https://vxlink.fun" target="_blank" class="text-[10px] md:text-xs font-bold text-zinc-600 uppercase tracking-[0.3em]">
                Desenvolvido por <span class="text-zinc-400">VXLINK.FUN</span>
            </a>
        </footer>
    </div>
</body>
</html>
