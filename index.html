<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISISNET</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    body{
      background:#000;
      min-height:100vh;
      display:flex;
      justify-content:center;
      overflow-x:hidden;
      font-family:'Inter',sans-serif;
      color:#fff;
    }

    .app{
      width:100%;
      max-width:430px;
      min-height:100vh;
      padding:68px 22px 38px;
      position:relative;
      overflow:hidden;
      background:
      radial-gradient(circle at top,
      #3d89ff 0%,
      #1f57cb 17%,
      #081f5b 39%,
      #020814 70%,
      #000 100%);
    }

    .app::before{
      content:'';
      position:absolute;
      inset:0;
      background:
      radial-gradient(circle at 50% 8%, rgba(55,137,255,.35), transparent 42%),
      linear-gradient(to bottom, rgba(255,255,255,.05), transparent 35%);
      pointer-events:none;
    }

    .content{
      position:relative;
      z-index:2;
    }

    .top-icon{
      width:88px;
      height:88px;
      border-radius:28px;
      background:linear-gradient(145deg,#39a0ff,#045dff);
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:
      0 25px 55px rgba(0,102,255,.38),
      inset 0 1px 1px rgba(255,255,255,.18);
    }

    .top-icon svg{
      width:45px;
      fill:#fff;
      filter:drop-shadow(0 4px 10px rgba(0,0,0,.25));
    }

    .logo{
      margin-top:44px;
      margin-bottom:30px;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .logo img{
      width:100%;
      max-width:355px;
      height:auto;
      object-fit:contain;
      display:block;
      filter:drop-shadow(0 10px 26px rgba(0,102,255,.35));
    }

    .line{
      width:100%;
      height:2px;
      margin-bottom:30px;
      background:
      linear-gradient(90deg,
      transparent,
      rgba(92,154,255,.95),
      transparent);
      box-shadow:0 0 18px rgba(92,154,255,.6);
    }

    .subtitle{
      text-align:center;
      color:#83bbff;
      font-size:15px;
      font-weight:900;
      letter-spacing:9px;
      margin-bottom:64px;
      text-shadow:0 0 12px rgba(70,145,255,.45);
    }

    .menu{
      display:flex;
      flex-direction:column;
      gap:25px;
    }

    .card{
      min-height:100px;
      background:
      linear-gradient(180deg,
      rgba(12,12,15,.98),
      rgba(2,2,4,.98));
      border-radius:34px;
      padding:18px 24px 18px 30px;
      display:flex;
      align-items:center;
      gap:22px;
      text-decoration:none;
      color:#fff;
      border:1px solid rgba(255,255,255,.06);
      box-shadow:
      0 22px 45px rgba(0,0,0,.48),
      inset 0 1px 0 rgba(255,255,255,.05);
      transition:.2s ease;
    }

    .card:active{
      transform:scale(.985);
    }

    .icon{
      width:62px;
      min-width:62px;
      height:62px;
      border-radius:20px;
      background:linear-gradient(145deg,#12203c,#091323);
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px solid rgba(80,145,255,.15);
      box-shadow:inset 0 0 18px rgba(67,132,255,.08);
    }

    .icon svg{
      width:34px;
      fill:#5ea9ff;
      filter:drop-shadow(0 0 8px rgba(60,146,255,.25));
    }

    .text{
      flex:1;
      display:flex;
      flex-direction:column;
      justify-content:center;
      min-width:0;
    }

    .title{
      font-family:'Anton',sans-serif;
      font-size:25px;
      line-height:1;
      letter-spacing:.4px;
      color:#fff;
      white-space:nowrap;
    }

    .desc{
      margin-top:8px;
      color:rgba(255,255,255,.44);
      font-size:14px;
      font-weight:700;
      white-space:nowrap;
    }

    .arrow{
      font-size:46px;
      color:rgba(255,255,255,.18);
      margin-top:-4px;
    }

    .bottom-line{
      width:100%;
      height:2px;
      margin:70px 0 26px;
      background:
      linear-gradient(90deg,
      transparent,
      rgba(92,154,255,.95),
      transparent);
      box-shadow:0 0 18px rgba(92,154,255,.6);
    }

    footer{
      text-align:center;
      color:rgba(180,205,255,.42);
      font-size:11px;
      font-weight:900;
      letter-spacing:8px;
    }

    footer span{
      color:#2b84ff;
    }

    @media(max-width:390px){
      .app{
        padding-left:18px;
        padding-right:18px;
      }

      .logo img{
        max-width:335px;
      }

      .title{
        font-size:23px;
      }

      .desc{
        font-size:13px;
      }

      .subtitle{
        font-size:14px;
        letter-spacing:7px;
      }

      footer{
        letter-spacing:6px;
      }
    }
  </style>
</head>

<body>

  <main class="app">
    <div class="content">

      <div class="top-icon">
        <svg viewBox="0 0 24 24">
          <path d="M13.3 2.2 4.2 13.7c-.5.6 0 1.5.8 1.5h5.2l-1.4 6.1c-.2.9.9 1.4 1.5.7l9.4-11.7c.5-.6 0-1.5-.8-1.5h-5.3l1.2-5.6c.2-.9-.9-1.5-1.5-.8z"/>
        </svg>
      </div>

      <div class="logo">
        <img src="logo.png" alt="ISISNET">
      </div>

      <div class="line"></div>

      <div class="subtitle">ULTRA VELOCIDADE</div>

      <div class="menu">

        <a href="#" class="card">
          <div class="icon">
            <svg viewBox="0 0 24 24">
              <path d="M11 10h2v7h-2zm0-3h2v2h-2zm1-5C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
            </svg>
          </div>
          <div class="text">
            <div class="title">SOBRE NÓS</div>
            <div class="desc">Conheça nossa história</div>
          </div>
          <div class="arrow">›</div>
        </a>

        <a href="#" class="card">
          <div class="icon">
            <svg viewBox="0 0 24 24">
              <path d="M12.8 3.2c3.2.1 6 1.6 7.8 4.2.4.6.3 1.4-.2 1.9l-3.1 3.1c-.4.4-.9.5-1.4.3l-2-.7-2.6 2.6.7 2c.2.5.1 1-.3 1.4l-3.1 3.1c-.5.5-1.3.6-1.9.2-2.6-1.8-4.1-4.6-4.2-7.8 0-.4.1-.8.4-1.1l8.8-8.8c.3-.3.7-.4 1.1-.4z"/>
            </svg>
          </div>
          <div class="text">
            <div class="title">NOSSOS PLANOS</div>
            <div class="desc">A internet mais rápida</div>
          </div>
          <div class="arrow">›</div>
        </a>

        <a href="#" class="card">
          <div class="icon">
            <svg viewBox="0 0 24 24">
              <path d="M15 3l-6-2-6 2v18l6-2 6 2 6-2V1zm-1 15-4-1.5V4l4 1.5zm5-1-3 1V5l3-1zM5 5l3-1v13l-3 1z"/>
            </svg>
          </div>
          <div class="text">
            <div class="title">VER DISPONIBILIDADE</div>
            <div class="desc">Consulte sua cobertura</div>
          </div>
          <div class="arrow">›</div>
        </a>

        <a href="#" class="card">
          <div class="icon">
            <svg viewBox="0 0 24 24">
              <path d="M10.5 12a4.4 4.4 0 1 0 0-8.8 4.4 4.4 0 0 0 0 8.8Zm0 2c-3.7 0-7.5 1.9-7.5 5.2V21h11.2a7.4 7.4 0 0 1-.5-2.7c0-1.2.3-2.3.8-3.3-1.2-.6-2.6-1-4-1Zm8.5-.8-4.3 1.9V18c0 2.1 1.4 3.9 4.3 4.9 2.9-1 4.3-2.8 4.3-4.9v-2.9L19 13.2Z"/>
            </svg>
          </div>
          <div class="text">
            <div class="title">ÁREA DO CLIENTE</div>
            <div class="desc">2ª via e suporte</div>
          </div>
          <div class="arrow">›</div>
        </a>

      </div>

      <div class="bottom-line"></div>

      <footer>DESENVOLVIDO POR <span>VXART.SHOP</span></footer>

    </div>
  </main>

</body>
</html>
